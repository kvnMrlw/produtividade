<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
</head>
<body>
    <h1>Cadastro</h1>

    <form action="{% url 'cadastro' %}" method="POST">
    {% csrf_token %}

        <label for="username">Username</label><br>
        <input type="text" placeholder="Username..." id="username" name="username" value="{% if not erros.username %}{{ username|default:''}}{% endif %}" required>

            {% if erros.username %}
                <p class="alert alert-danger">{{ erros.username }}</p>
            {% endif %}

            <br> 
        <label for="email">Email</label><br>
        <input type="email" placeholder="Email..." id="email" name="email" value="{% if not erros.email %}{{ email|default:''}}{% endif %}" required>

            {% if erros.email %}
                <p class="alert alert-danger">{{ erros.email }}</p>
            {% endif %}
            
            <br>
        <label for="password">Senha</label><br>
        <input type="password" placeholder="Senha..." id="password" name="password" required>
            <br>
        <label for="confirm_password">Confime sua senha</label><br>
        <input type="password" placeholder="Senha..." id="confirm_password" name="confirm_password">

            {% if erros.password %}
                <p class="alert alert-danger">{{ erros.password }} </p>
            {% endif %}

            <br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
