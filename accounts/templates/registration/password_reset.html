<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password reset</title>
</head>
<body>
    <a href="/auth/login">voltar para login</a>
    <h1>Recupere sua senha</h1>
    <p>
        Informe seu email já cadastrado e enviaremos<br>
        um link para redefinir sua senha
    </p>


    <form method="POST"> {% csrf_token %}

        <label for="email">E-mail</label><br>
        {{ form.email }}

        {% if form.email.errors %}
        <p>{{ form.email.errors }}</p>
        {% endif %}
            <br>
            <br>
        <input type="submit" value="Enviar link ->">

    </form>
    <p>______ ou ______</p>
    <a href="/auth/login">Lembrei da minha senha</a>
</body>
</html>
